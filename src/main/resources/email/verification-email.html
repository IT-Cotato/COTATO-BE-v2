<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>코테이토 인증 코드</title>
</head>
<body style="margin: 0; padding: 0; background-color: #f5f5f5; font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;">
<div style="max-width: 600px; margin: 0 auto; background-color: #ffffff;">
    <img src="cid:verification-header" alt="COTATO" style="width: 100%; display: block;"/>

    <div style="padding: 60px 20px 40px 20px; text-align: center;">
        <div style="font-weight: 600; font-size: 16px; line-height: 26px; color: #1F1F1F; margin-bottom: 8px;">
            코테이토 인증 코드입니다.
        </div>
        <div style="font-weight: 400; font-size: 14px; line-height: 22px; color: #1F1F1F; margin-bottom: 50px;">
            이메일로 전송된 인증번호를 입력해 주세요.
        </div>

        <div style="font-weight: 600; font-size: 16px; line-height: 26px; color: #1F1F1F; margin-bottom: 12px;">
            인증번호
        </div>
        <div style="display: inline-block; width: 261px; background: #ffffff; border-radius: 10px; box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2); padding: 12px 20px; box-sizing: border-box; margin-bottom: 16px;">
            <span style="font-size: 28px; font-weight: 700; color: #1F1F1F; letter-spacing: 6px;">{{code}}</span>
        </div>

        <div style="font-weight: 600; font-size: 14px; line-height: 22px; color: #F87D02;">
            10분안에 입력 부탁드립니다. 감사합니다.
        </div>
    </div>

    <img src="cid:verification-bottom" alt="COTATO Footer" style="width: 100%; display: block;"/>
</div>
</body>
</html>
