# stage - server

server:
  port: 8082

spring:
  jpa:
    hibernate:
      ddl-auto: ${STAGE_DDL_AUTO:update}
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${STAGE_DB_PATH}
    username: ${STAGE_DB_USERNAME}
    password: ${STAGE_DB_PWD}

  config:
    import: classpath:variable/variable-stage.yml

springdoc:
  swagger-ui:
    enabled: true
