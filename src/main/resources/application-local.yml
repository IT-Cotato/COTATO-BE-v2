# local - server

server:
  port: 8080

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${LOCAL_DB_PATH}
    username: ${LOCAL_DB_USERNAME}
    password: ${LOCAL_DB_PWD}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  config:
    import: classpath:variable/variable-local.yml

springdoc:
  swagger-ui:
    enabled: true

logging:
  level:
    org.springframework.security: DEBUG
