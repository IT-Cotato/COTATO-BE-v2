# prod - server

server:
  port: 8080

spring:
  jpa:
    hibernate:
      ddl-auto: ${PROD_DDL_AUTO:none}
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  config:
    import: classpath:variable/variable-prod.yml

springdoc:
  swagger-ui:
    enabled: false
