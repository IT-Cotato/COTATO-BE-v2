# prod - server

server:
  port: 8080

spring:
  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:none}
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  datasource:
    primary:
      driver-class-name: com.mysql.cj.jdbc.Driver
      jdbc-url: ${DB_URL}
      username: ${DB_USERNAME}
      password: ${DB_PASSWORD}
    recruit:
      driver-class-name: com.mysql.cj.jdbc.Driver
      jdbc-url: ${RECRUIT_DB_URL}
      username: ${RECRUIT_DB_USERNAME}
      password: ${RECRUIT_DB_PASSWORD}

  config:
    import: classpath:variable/variable-prod.yml

springdoc:
  swagger-ui:
    enabled: false
