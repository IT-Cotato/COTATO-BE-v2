server:
  address: 127.0.0.1
  port: 18110
  error:
    include-message: never
spring:
  main:
    banner-mode: off
  jackson:
    deserialization:
      fail-on-null-for-primitives: true
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
logging:
  level:
    root: WARN
    org.springframework.boot.web.embedded.tomcat: INFO
