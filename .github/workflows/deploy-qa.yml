name: Deploy to QA Server

on:
  # QA 서버는 운영과 같은 GCP 서버이므로 명시적인 수동 실행만 허용한다.
  workflow_dispatch:
    inputs:
      ref:
        description: "배포할 release/<버전> 또는 hotfix/<버전> 브랜치"
        required: true
        type: string

env:
  DOCKER_IMAGE_NAME: cotato-homepage

jobs:
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.extract-version.outputs.version }}
      ref: ${{ steps.extract-version.outputs.ref }}

    steps:
      - name: Validate deployment branch and extract version
        id: extract-version
        shell: bash
        env:
          QA_DEPLOY_REF: ${{ inputs.ref }}
        run: |
          # 1. 체크아웃 전에 브랜치 범위와 Docker 태그 형식을 검사한다.
          if [[ "$QA_DEPLOY_REF" =~ ^(refs/heads/)?(release|hotfix)/([A-Za-z0-9_][A-Za-z0-9._-]{0,127})$ ]]; then
            VERSION="${BASH_REMATCH[3]}"
          else
            echo "::error::Specify a release/<version> or hotfix/<version> branch."
            exit 1
          fi

          NORMALIZED_REF="${QA_DEPLOY_REF#refs/heads/}"
          if ! git check-ref-format "refs/heads/$NORMALIZED_REF"; then
            echo "::error::The deployment branch name is invalid."
            exit 1
          fi

          # 2. 빌드와 배포가 같은 검증된 브랜치를 사용하도록 전달한다.
          printf 'version=%s\n' "$VERSION" >> "$GITHUB_OUTPUT"
          printf 'ref=%s\n' "$NORMALIZED_REF" >> "$GITHUB_OUTPUT"

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.extract-version.outputs.ref }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew clean build -x test

      - name: Run tests
        run: ./gradlew test

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/${{ env.DOCKER_IMAGE_NAME }}:${{ steps.extract-version.outputs.version }}
            ${{ secrets.DOCKER_USERNAME }}/${{ env.DOCKER_IMAGE_NAME }}:qa-latest
          cache-from: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/${{ env.DOCKER_IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/${{ env.DOCKER_IMAGE_NAME }}:buildcache,mode=max

  deploy:
    name: Deploy to QA Server
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.build-and-push.outputs.ref }}

      - name: Copy deployment files to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          source: "deployment/qa/*,deployment/nginx/*"
          target: "~/deployment"
          strip_components: 1
          rm: false

      - name: Deploy with Blue-Green strategy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            cd ~/deployment/qa

            # 환경변수 설정
            export DOCKER_IMAGE_NAME=${{ secrets.DOCKER_USERNAME }}/${{ env.DOCKER_IMAGE_NAME }}
            export DOCKER_IMAGE_TAG=${{ needs.build-and-push.outputs.image_tag }}
            export DB_URL=${{ secrets.DB_URL }}
            export DB_USERNAME=${{ secrets.DB_USERNAME }}
            export DB_PASSWORD=${{ secrets.DB_PASSWORD }}
            export JWT_SECRET=${{ secrets.JWT_SECRET }}
            export MAIL_HOST=${{ secrets.MAIL_HOST }}
            export MAIL_PORT=${{ secrets.MAIL_PORT }}
            export MAIL_USERNAME=${{ secrets.MAIL_USERNAME }}
            export MAIL_PASSWORD=${{ secrets.MAIL_PASSWORD }}
            export AWS_ACCESS_KEY=${{ secrets.AWS_ACCESS_KEY }}
            export AWS_SECRET_KEY=${{ secrets.AWS_SECRET_KEY }}
            export AWS_REGION=${{ secrets.AWS_REGION }}
            export AWS_S3_BUCKET=${{ secrets.AWS_S3_BUCKET }}
            export AES_SECRET_KEY=${{ secrets.AES_SECRET_KEY }}
            export AES_SECRET_SALT=${{ secrets.AES_SECRET_SALT }}
            export RECRUIT_DB_URL=${{ secrets.RECRUIT_DB_URL }}
            export RECRUIT_DB_USERNAME=${{ secrets.RECRUIT_DB_USERNAME }}
            export RECRUIT_DB_PASSWORD=${{ secrets.RECRUIT_DB_PASSWORD }}

            # 환경변수 .env 파일로 저장
            cat > .env << EOF
            DOCKER_IMAGE_NAME=$DOCKER_IMAGE_NAME
            DOCKER_IMAGE_TAG=$DOCKER_IMAGE_TAG
            DB_URL=$DB_URL
            DB_USERNAME=$DB_USERNAME
            DB_PASSWORD=$DB_PASSWORD
            JWT_SECRET=$JWT_SECRET
            MAIL_HOST=$MAIL_HOST
            MAIL_PORT=$MAIL_PORT
            MAIL_USERNAME=$MAIL_USERNAME
            MAIL_PASSWORD=$MAIL_PASSWORD
            AWS_ACCESS_KEY=$AWS_ACCESS_KEY
            AWS_SECRET_KEY=$AWS_SECRET_KEY
            AWS_REGION=$AWS_REGION
            AWS_S3_BUCKET=$AWS_S3_BUCKET
            AES_SECRET_KEY=$AES_SECRET_KEY
            AES_SECRET_SALT=$AES_SECRET_SALT
            RECRUIT_DB_URL=$RECRUIT_DB_URL
            RECRUIT_DB_USERNAME=$RECRUIT_DB_USERNAME
            RECRUIT_DB_PASSWORD=$RECRUIT_DB_PASSWORD
            EOF

            # Docker 로그인
            echo ${{ secrets.DOCKER_PASSWORD }} | docker login -u ${{ secrets.DOCKER_USERNAME }} --password-stdin

            # 배포 실행
            chmod +x ./deploy.sh
            ./deploy.sh

      - name: Notify deployment success
        if: success()
        run: |
          echo "=========================================="
          echo "QA Deployment Succeeded"
          echo "=========================================="

      - name: Notify deployment failure
        if: failure()
        run: |
          echo "=========================================="
          echo "[ERROR] QA Deployment Failed"
          echo "=========================================="
